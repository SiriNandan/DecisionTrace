# SYNTHETIC DATA - FOR DEMONSTRATION.
scenarios:
  - name: clear_decline
    description: "DTI far above limit (0.65 > 0.40 under LP-2026-v1)"
    applicant_id: "APP-0011"
    application_id: "LOAN-SCEN-0001"
    decision_date: "2026-02-10T10:00:00Z"
    test_only: false
    applicant_params:
      annual_income: 36000.00
      monthly_income: 3000.00
      existing_debt_service: 1950.00
      dti_ratio: 0.65
      credit_score: 680
      delinquencies_24m: 0
      account_age_months: 48
      employment_months: 36
      requested_amount: 12000.00
      currency: "GBP"
      payslip_status: "received"
      address_proof_status: "received"
    expected_outcome: "DECLINE"
    expected_policy_version: "LP-2026-v1"
    expected_cited_sections:
      - "3.2 Debt-to-income limit"
    expected_status: "verified"
    post_seed_mutation:
      annual_income: 108000.00
      monthly_income: 9000.00
      existing_debt_service: 1620.00
      dti_ratio: 0.18

