services:
  postgres:
    image: postgres:15
    container_name: decisiontrace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decisiontrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisiontrace_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-decisiontrace}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-decisiontrace} -d $${POSTGRES_DB:-decisiontrace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create schema, load policies, register the model, seed the demo scenarios.
  seed:
    build: { context: ., dockerfile: Dockerfile.api }
    command: ["python", "-m", "data.seed"]
    environment: &api_env
      DB_URL: postgresql://${POSTGRES_USER:-decisiontrace}:${POSTGRES_PASSWORD:-decisiontrace_local_dev}@postgres:5432/${POSTGRES_DB:-decisiontrace}
      ENV: ${ENV:-dev}
      LLM_BACKEND: ${LLM_BACKEND:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      APP_DB_URL: postgresql://app_role:app_role_local_dev@postgres:5432/${POSTGRES_DB:-decisiontrace}
      DT_API_KEY: ${DT_API_KEY:-dev-demo-key}
      DT_ID_SECRET: ${DT_ID_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["app"]

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    restart: unless-stopped
    environment: *api_env
    depends_on:
      seed: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request;assert json.load(urllib.request.urlopen('http://localhost:8000/health'))['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["app"]

  web:
    build: { context: ./frontend }
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    profiles: ["app"]

volumes:
  pgdata:

