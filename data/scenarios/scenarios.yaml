    test_only: true
    applicant_params:
      annual_income: 60000.00
      monthly_income: 5000.00
      existing_debt_service: 1500.00
      dti_ratio: 0.30
      credit_score: 740
      delinquencies_24m: 0
      account_age_months: 60
      employment_months: 48
      requested_amount: 10000.00
      currency: "GBP"
      payslip_status: "received"
      address_proof_status: "received"
    expected_outcome: "APPROVE"
