  - name: override_case
    description: "Initial DECLINE overridden to APPROVE with a 20+ character reason in overrides table"
    applicant_id: "APP-0017"
    application_id: "LOAN-SCEN-0007"
    decision_date: "2026-02-01T12:00:00Z"
    test_only: false
    applicant_params:
      annual_income: 48000.00
      monthly_income: 4000.00
      existing_debt_service: 1720.00
      dti_ratio: 0.43
      credit_score: 720
      delinquencies_24m: 0
      account_age_months: 64
      employment_months: 48
      requested_amount: 8000.00
      currency: "GBP"
      payslip_status: "received"
      address_proof_status: "received"
    expected_initial_outcome: "DECLINE"
    expected_outcome: "APPROVE"
    expected_policy_version: "LP-2026-v1"
    expected_cited_sections:
      - "3.2 Debt-to-income limit"
      - "5.1 Manual review"
    override:
